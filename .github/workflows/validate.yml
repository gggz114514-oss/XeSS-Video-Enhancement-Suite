name: validate
on: [push, pull_request]
jobs:
  comfy-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test-only dependencies (not installed into user ComfyUI)
        run: python -m pip install numpy==2.3.5 opencv-python-headless==5.0.0.93
      - name: Source and manifest validation
        run: python tools/validate_repo.py
      - name: Dependency-light tests including R3 upgrade fault injection
        env:
          COMFYUI_XESS_SKIP_RUNTIME_DOWNLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Widget state and visibility
        run: node tests/r4_widgets.cjs
